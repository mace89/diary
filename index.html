<!DOCTYPE html>
<html>
<head>
  <title>Trade Diary</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:20px; }
    input, button, textarea { width:100%; margin:10px 0; padding:10px; background:#000; color:#0f0; border:1px solid #0f0; }
    .trade { border:1px solid #0f0; padding:10px; margin:10px 0; }
    img { width:100%; }
  </style>
</head>
<body>

<h1>TRADE DIARY</h1>

<input type="date" id="date">

<h2>EU</h2>
<input id="euLink" placeholder="TradingView link">
<button onclick="add('eu')">Add EU</button>
<div id="euList"></div>

<h2>US</h2>
<input id="usLink" placeholder="TradingView link">
<button onclick="add('us')">Add US</button>
<div id="usList"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://ebdyavzqraejwrvaclfg.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZHlhdnpxcmFlandydmFjbGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Nzk0NzgsImV4cCI6MjA5MzQ1NTQ3OH0.Jy0zoWp2em-KEY"
);

let date = "";

document.getElementById("date").onchange = e => {
  date = e.target.value;
  load();
};

window.add = async (session) => {
  const link = document.getElementById(session+"Link").value;

  await supabase.from("trades_2").insert({
    date,
    session,
    image_url: link,
    notes: ""
  });

  load();
};

async function load(){
  ["eu","us"].forEach(async (s)=>{
    let { data } = await supabase
      .from("trades_2")
      .select("*")
      .eq("date", date)
      .eq("session", s);

    const box = document.getElementById(s+"List");
    box.innerHTML = "";

    (data||[]).forEach(t=>{
      box.innerHTML += `
        <div class="trade">
          <img src="${t.image_url}" />
          <textarea onchange="saveNote('${t.id}', this.value)">${t.notes||""}</textarea>
        </div>
      `;
    });
  });
}

window.saveNote = async (id, val) => {
  await supabase.from("trades_2").update({ notes: val }).eq("id", id);
};
</script>

</body>
</html>
